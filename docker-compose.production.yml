# Use together with docker-compose.yml. Requires Docker Compose 2.24.4+.
services:
  orders-postgres:
    restart: unless-stopped
  products-postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  kafka:
    restart: unless-stopped

  migrate:
    # Production databases must not be populated with demo users or products.
    command: sh -c "npx prisma migrate deploy --config backend/orders-service/prisma.config.ts && npx prisma migrate deploy --config backend/products-service/prisma.config.ts"

  orders-service:
    restart: unless-stopped
  products-service:
    restart: unless-stopped

  realtime-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}

  gateway:
    restart: unless-stopped
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  web:
    restart: unless-stopped
    build:
      args:
        VITE_GRAPHQL_URL: /graphql
        # Empty base URL uses the browser origin for Socket.IO.
        VITE_SOCKET_URL: ""
    volumes:
      - media_data:/usr/share/nginx/html/media:ro
    ports: !override
      - "${WEB_PORT:-80}:3000"

volumes:
  media_data:
