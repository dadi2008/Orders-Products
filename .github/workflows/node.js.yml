name: CI and deploy to Google Cloud VM

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm test

  deploy:
    name: Deploy on the Google Cloud VM
    needs: ci
    if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, gcp-production]
    environment: production
    timeout-minutes: 45
    concurrency:
      group: orders-products-production
      cancel-in-progress: false
    env:
      COMPOSE_PROJECT_NAME: orders-products-production
      COMPOSE_FILE: docker-compose.yml:docker-compose.production.yml
      ORDERS_POSTGRES_PASSWORD: ${{ secrets.ORDERS_POSTGRES_PASSWORD }}
      PRODUCTS_POSTGRES_PASSWORD: ${{ secrets.PRODUCTS_POSTGRES_PASSWORD }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
      WEB_PORT: ${{ vars.WEB_PORT || '80' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate configuration and Docker access
        run: |
          set -euo pipefail
          for key in ORDERS_POSTGRES_PASSWORD PRODUCTS_POSTGRES_PASSWORD JWT_ACCESS_SECRET JWT_REFRESH_SECRET WEB_ORIGIN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done
          # Passwords are embedded in PostgreSQL connection URLs.
          for key in ORDERS_POSTGRES_PASSWORD PRODUCTS_POSTGRES_PASSWORD; do
            if [[ ! "${!key}" =~ ^[A-Za-z0-9_-]{24,}$ ]]; then
              echo "::error::$key must contain at least 24 URL-safe characters: A-Z, a-z, 0-9, _ or -."
              exit 1
            fi
          done
          if (( ${#JWT_ACCESS_SECRET} < 32 || ${#JWT_REFRESH_SECRET} < 32 )) || [[ "$JWT_ACCESS_SECRET" == "$JWT_REFRESH_SECRET" ]]; then
            echo "::error::JWT secrets must be different and at least 32 characters long."
            exit 1
          fi
          if [[ ! "$WEB_ORIGIN" =~ ^https?://[^/[:space:]]+$ ]]; then
            echo "::error::WEB_ORIGIN must be the public origin, such as https://inventory.example.com, without a trailing slash."
            exit 1
          fi
          if [[ ! "$WEB_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$WEB_PORT < 1 || 10#$WEB_PORT > 65535 )); then
            echo "::error::WEB_PORT must be a port between 1 and 65535."
            exit 1
          fi
          docker info > /dev/null
          docker compose version
          docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull gateway web

      - name: Apply migrations and start services
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check the public entry point
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 3 "http://127.0.0.1:${WEB_PORT}/api/health"
          curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:${WEB_PORT}/"

      - name: Show deployment status
        if: always()
        run: docker compose ps -a
