services:
  orders-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_POSTGRES_PASSWORD:?ORDERS_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data

  products-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: ${PRODUCTS_POSTGRES_PASSWORD:?PRODUCTS_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - products_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    command:
      - sh
      - -ec
      - |
        for topic in inventory.order.deleted inventory.order.deleted.dlq inventory.product.deleted inventory.product.deleted.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$${topic}" --partitions 1 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  migrate:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: sh -c "npx prisma migrate deploy --config backend/orders-service/prisma.config.ts && npx prisma migrate deploy --config backend/products-service/prisma.config.ts && npm run db:seed"
    environment:
      ORDERS_DATABASE_URL: postgresql://orders:${ORDERS_POSTGRES_PASSWORD:?ORDERS_POSTGRES_PASSWORD is required}@orders-postgres:5432/orders?schema=public
      PRODUCTS_DATABASE_URL: postgresql://products:${PRODUCTS_POSTGRES_PASSWORD:?PRODUCTS_POSTGRES_PASSWORD is required}@products-postgres:5432/products?schema=public
    depends_on:
      orders-postgres:
        condition: service_healthy
      products-postgres:
        condition: service_healthy

  orders-service:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node backend/orders-service/dist/main.js
    environment:
      PORT: 3001
      ORDERS_DATABASE_URL: postgresql://orders:${ORDERS_POSTGRES_PASSWORD:?ORDERS_POSTGRES_PASSWORD is required}@orders-postgres:5432/orders?schema=public
      KAFKA_BROKERS: kafka:9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''fetch("http://127.0.0.1:3001/orders").then(({ ok }) => process.exit(ok ? 0 : 1)).catch(() => process.exit(1))''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  products-service:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node backend/products-service/dist/main.js
    environment:
      PORT: 3002
      PRODUCTS_DATABASE_URL: postgresql://products:${PRODUCTS_POSTGRES_PASSWORD:?PRODUCTS_POSTGRES_PASSWORD is required}@products-postgres:5432/products?schema=public
      KAFKA_BROKERS: kafka:9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''fetch("http://127.0.0.1:3002/products").then(({ ok }) => process.exit(ok ? 0 : 1)).catch(() => process.exit(1))''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  realtime-service:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node backend/realtime-service/dist/main.js
    environment:
      PORT: 3003
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"

  gateway:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node backend/gateway/dist/main.js
    environment:
      PORT: 3000
      ORDERS_SERVICE_URL: http://orders-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /app/media
    volumes:
      - ./media:/app/media
    depends_on:
      orders-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''fetch("http://127.0.0.1:3000/api/health").then(({ ok }) => process.exit(ok ? 0 : 1)).catch(() => process.exit(1))''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    image: orders-products-web:local
    build:
      context: .
      target: web
    depends_on:
      gateway:
        condition: service_healthy
      realtime-service:
        condition: service_started
    volumes:
      - ./media:/usr/share/nginx/html/media:ro
    ports:
      - "${WEB_PORT:-3005}:3000"

volumes:
  orders_postgres_data:
  products_postgres_data:
