services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  migrate:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: sh -c "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma && npm run db:seed"
    environment:
      DATABASE_URL: postgresql://inventory:inventory@postgres:5432/inventory?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node apps/orders-service/dist/main.js
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://inventory:inventory@postgres:5432/inventory?schema=public
      KAFKA_BROKERS: kafka:9092
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started

  products-service:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node apps/products-service/dist/main.js
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://inventory:inventory@postgres:5432/inventory?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

  realtime-service:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node apps/realtime-service/dist/main.js
    environment:
      PORT: 3003
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"

  gateway:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: node apps/gateway/dist/main.js
    environment:
      PORT: 3000
      ORDERS_SERVICE_URL: http://orders-service:3001
      PRODUCTS_SERVICE_URL: http://products-service:3002
    depends_on:
      orders-service:
        condition: service_started
      products-service:
        condition: service_started
  web:
    image: orders-products-app:local
    build:
      context: .
      target: base
    command: npm run start -w @inventory/web
    environment:
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3003
    depends_on:
      gateway:
        condition: service_started
      realtime-service:
        condition: service_started
    ports:
      - "3005:3000"

volumes:
  postgres_data:
